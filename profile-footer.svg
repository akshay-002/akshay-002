<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img" aria-labelledby="title desc">
  <title id="title">Good answers leave a trail.</title>
  <desc id="desc">A terminal footer with a diagram connecting source, retrieval, and answer.</desc>
  <defs>
    <linearGradient id="panel"><stop stop-color="#101b27"/><stop offset="1" stop-color="#141321"/></linearGradient>
    <linearGradient id="signal"><stop stop-color="#68ebff"/><stop offset=".55" stop-color="#8cf5b3"/><stop offset="1" stop-color="#bb9cff"/></linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#8fa8c3" opacity=".14"/></pattern>
  </defs>
  <rect x="1" y="1" width="898" height="174" rx="16" fill="url(#panel)" stroke="#344455"/>
  <rect x="489" y="16" width="390" height="144" rx="9" fill="url(#grid)"/>
  <path d="M32 40h38" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Consolas,monospace">
    <text x="83" y="45" fill="#a6bed2" font-size="15" letter-spacing="1.8">TRACE / 001</text>
    <text x="34" y="134" fill="#8cf5b3" font-size="17">$ trace --source</text>
    <path d="M547 83h273" stroke="url(#signal)" stroke-width="2"/>
    <path d="m601 78 6 5-6 5m130-10 6 5-6 5" fill="none" stroke="#8daec4"/>
    <g fill="#111b27" stroke-width="2">
      <rect x="541" y="77" width="12" height="12" rx="2" stroke="#68ebff"/>
      <path d="m683 74 9 9-9 9-9-9Z" stroke="#8cf5b3"/>
      <circle cx="820" cy="83" r="7" stroke="#bb9cff"/>
    </g>
    <g text-anchor="middle" font-size="15" letter-spacing="1">
      <text x="547" y="113" fill="#68ebff">SOURCE</text>
      <text x="683" y="113" fill="#8cf5b3">RETRIEVAL</text>
      <text x="820" y="113" fill="#bb9cff">ANSWER</text>
    </g>
  </g>
  <text x="31" y="100" fill="#f2f7ff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Good answers leave a trail.</text>
</svg>
